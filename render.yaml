services:
  - type: web
    name: shenlun-web-admin
    runtime: node
    rootDir: web-admin
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: AUTO_GENERATE
        value: "1"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: PUBLISH_FUNCTION_URL
        sync: false
      - key: PUBLISH_ADMIN_SECRET
        sync: false
