<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>每日申论素材后台</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">申</div>
        <div>
          <h1>每日申论</h1>
          <p>素材生成后台</p>
        </div>
      </div>

      <section class="status-panel">
        <div class="status-row">
          <span>学习日期</span>
          <strong id="targetDate">-</strong>
        </div>
        <div class="status-row">
          <span>DeepSeek</span>
          <strong id="deepSeekStatus">-</strong>
        </div>
        <div class="status-row">
          <span>发布通道</span>
          <strong id="publishStatus">-</strong>
        </div>
        <div class="status-row">
          <span>自动任务</span>
          <strong id="schedulerStatus">-</strong>
        </div>
      </section>

      <div class="field-group">
        <label for="dateInput">内容日期</label>
        <input id="dateInput" type="date">
      </div>

      <div class="action-stack">
        <button id="collectBtn" class="btn secondary" type="button">抓取文章</button>
        <button id="generateBtn" class="btn primary" type="button">生成成品稿</button>
        <button id="publishBtn" class="btn danger" type="button">发布到小程序</button>
      </div>
    </aside>

    <section class="workspace">
      <header class="workspace-header">
        <div>
          <h2>7:30 前一天素材</h2>
          <p>后台先生成，发布后小程序只读取成品稿。</p>
        </div>
        <button id="copyBtn" class="btn ghost" type="button">复制全文</button>
      </header>

      <section class="notice" id="notice">正在读取后台状态...</section>

      <div class="grid">
        <section class="panel article-panel">
          <div class="panel-head">
            <h3>文章列表</h3>
            <span id="articleCount">0 篇</span>
          </div>
          <div id="articleList" class="article-list empty">还没有抓取文章</div>
        </section>

        <section class="panel preview-panel">
          <div class="panel-head">
            <h3>成品稿预览</h3>
            <span id="copyCount">0 字</span>
          </div>
          <textarea id="previewText" spellcheck="false" placeholder="点击“生成成品稿”后，这里会出现可直接复制到微信/文档的全文。"></textarea>
        </section>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
